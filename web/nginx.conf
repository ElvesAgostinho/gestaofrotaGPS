# A aplicação web e a API no mesmo endereço.
#
# ${API_UPSTREAM} é substituído no arranque (envsubst do Nginx): «api:8080» no
# docker compose, «projeto_api:8080» no Easypanel — sem reconstruir a imagem.
#
# /api vai para o backend; tudo o resto é a aplicação (uma SPA: qualquer
# caminho devolve o index.html e o React Router decide o ecrã).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos grandes: os cookies de outros sítios no mesmo domínio
    # acumulam-se; 32 KB acompanha o limite do backend.
    large_client_header_buffers 4 32k;

    # Ficheiros carregados podem ter até 15 MB (limite do backend); dar folga.
    client_max_body_size 32m;

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Reescrito, não acrescentado: o limite de tentativas de login conta
        # por endereço, e um cliente que mandasse o seu próprio X-Forwarded-For
        # escolhia o balde em que cai.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O mapa em tempo real usa SSE: com buffer, os eventos chegavam de
        # minuto a minuto em vez de ao segundo.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Aplicação -------------------------------------------------------
    # Os ficheiros com hash no nome podem ficar em cache para sempre; o
    # index.html nunca, senão a versão nova só aparecia depois de limpar a cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Sem versão do servidor nos cabeçalhos de erro.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
