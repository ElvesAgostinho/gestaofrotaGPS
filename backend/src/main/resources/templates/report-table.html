<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${r.title}">Relatório</title>
  <style>
    @page { size: A4 landscape; margin: 12mm 10mm; }
    body { font-family: sans-serif; font-size: 8pt; color: #18181b; }
    h1 { font-size: 13pt; margin: 6px 0 8px; }
    table.dados { width: 100%; border-collapse: collapse; }
    table.dados th { text-align: left; font-size: 7pt; text-transform: uppercase; letter-spacing: 0.3pt;
                     color: #71717a; border-bottom: 1px solid #18181b; padding: 3px 4px; background: #f4f4f5; }
    table.dados td { border-bottom: 1px solid #ececef; padding: 2.5px 4px; vertical-align: top; }
    table.dados tr { page-break-inside: avoid; }
    thead { display: table-header-group; }
    .num { text-align: right; white-space: nowrap; }
    .muted { color: #71717a; }
  </style>
</head>
<body>
<div th:replace="~{timbre :: cabecalho(${timbre}, ${r.data}, 'Relatório')}"></div>
<h1 th:text="${r.title}">Relatório</h1>
<p class="muted" th:if="${r.rows.isEmpty()}">Sem dados para o período.</p>
<table class="dados" th:if="${!r.rows.isEmpty()}">
  <thead>
    <tr><th th:each="h : ${r.headers}" th:text="${h}"></th></tr>
  </thead>
  <tbody>
    <tr th:each="linha : ${r.rows}">
      <td th:each="c : ${linha}" th:classappend="${c.numeric} ? 'num' : ''" th:text="${c.text}"></td>
    </tr>
  </tbody>
</table>
<p class="muted" style="margin-top:6px;" th:text="${r.rows.size()} + ' linha(s)'"></p>
<div th:replace="~{timbre :: rodape(${geradoEm})}"></div>
</body>
</html>
