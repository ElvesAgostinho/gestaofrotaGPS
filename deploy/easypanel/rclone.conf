# Destino das copias de seguranca fora do servidor (rclone).
# Preencha UM remoto e ponha o nome dele em BACKUP_REMOTE (ex.: BACKUP_REMOTE=copias:imbondeiro).
# Sem nada aqui, as copias ficam so no servidor -- e uma copia no mesmo disco morre com o disco.
#
# Exemplo Backblaze B2 (barato, 10 GB gratis):
# [copias]
# type = b2
# account = A_SUA_KEY_ID
# key = A_SUA_APPLICATION_KEY
#
# Exemplo S3 (AWS, Wasabi, MinIO...):
# [copias]
# type = s3
# provider = AWS
# access_key_id = ...
# secret_access_key = ...
# region = eu-west-1
