# Instalação de referência do IMBONDEIRO OS.
#
#   cp .env.example .env      # e preencher os segredos
#   docker compose up -d --build
#
# Sobe: a base de dados, a API, a aplicação web (que serve /api pelo mesmo
# endereço) e as cópias de segurança automáticas. O motor de rotas é opcional:
#   docker compose --profile rotas run --rm osrm-preparar   # uma vez
#   docker compose --profile rotas up -d osrm
#
# O compose recusa arrancar sem os segredos — ver a sintaxe ${VAR:?mensagem}.

services:
  # ---- Base de dados --------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-imbondeiro}
      POSTGRES_USER: ${DATABASE_USER:?defina DATABASE_USER no .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
      # Português para ordenações e mensagens.
      LANG: pt_PT.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME:-imbondeiro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # A base de dados não precisa de estar exposta: só a aplicação lhe acede.
    expose:
      - "5432"

  # ---- API ------------------------------------------------------------------
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        # Esperar que o PostgreSQL aceite ligações, não apenas que arranque —
        # senão o Flyway falha no primeiro arranque de cada instalação.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_NAME: IMBONDEIRO OS
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-imbondeiro}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?gere um segredo; ver .env.example}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?gere um segredo; ver .env.example}
      # A web serve /api pelo mesmo endereço, por isso a única origem é a do site.
      CORS_ORIGINS: ${APP_WEB_URL:?indique o endereço da aplicação web}
      APP_WEB_URL: ${APP_WEB_URL}
      STORAGE_PATH: /var/lib/autocare/files
      STORAGE_PUBLIC_BASE_URL: ${APP_WEB_URL}
      # Email e Traccar configuram-se dentro da aplicação (Configurações), por
      # empresa. Estas variáveis são só o valor por omissão da instalação.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-IMBONDEIRO OS}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?indique o email do administrador da plataforma; ver .env.example}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?indique a palavra-passe inicial do administrador}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador da plataforma}
      TRACCAR_URL: ${TRACCAR_URL:-}
      TRACCAR_TOKEN: ${TRACCAR_TOKEN:-}
    volumes:
      - files:/var/lib/autocare/files
    # Só a web fala com a API; não há razão para a expor ao exterior.
    expose:
      - "8080"

  # ---- Aplicação web --------------------------------------------------------
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

  # ---- Cópias de segurança --------------------------------------------------
  # Todos os dias às BACKUP_HOUR (02h por omissão): base de dados + ficheiros,
  # guardadas em ./backups, apagadas passados BACKUP_KEEP_DAYS dias.
  # O que é preciso salvaguardar são DUAS coisas — só uma delas não chega.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_NAME: ${DATABASE_NAME:-imbondeiro}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # Opcional: remoto do rclone (deploy/easypanel/rclone.conf) para as
      # cópias saírem do servidor. Uma cópia no mesmo disco morre com o disco.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./deploy/easypanel/rclone.conf:/root/.config/rclone/rclone.conf:ro
      - files:/files:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]

  # ---- Motor de rotas (opcional) --------------------------------------------
  # Calcula a distância e a duração das rotas pelas estradas reais, sem
  # Internet e sem mandar os dados da frota para fora. Ativar com
  # --profile rotas. Depois, em Configurações → Motor de rotas, o endereço é
  # http://osrm:5000 e o botão «Testar» confirma que o mapa está carregado.
  osrm-preparar:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["rotas"]
    volumes:
      - osrm-data:/data
      - ./deploy/osrm-preparar.sh:/preparar.sh:ro
    entrypoint: ["sh", "/preparar.sh"]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["rotas"]
    restart: unless-stopped
    volumes:
      - osrm-data:/data
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "/data/angola-latest.osrm"]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:5000/route/v1/driving/13.2344,-8.8383;13.2600,-8.8200?overview=false' | grep -q '\"code\":\"Ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  files:
  osrm-data:
